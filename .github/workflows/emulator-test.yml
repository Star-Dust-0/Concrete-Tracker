name: Emulator smoke test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
      - run: gradle assembleDebug
      - run: sudo bash -c 'echo KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\" > /etc/udev/rules.d/99-kvm4all.rules; udevadm control --reload-rules; udevadm trigger --name-match=kvm'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.aistudio.concretecalc.vwxyz/com.example.MainActivity
            sleep 6
            mkdir -p shots
            adb exec-out screencap -p > shots/1-launch.png
            adb shell input tap 774 771
            sleep 2
            adb exec-out screencap -p > shots/2-today-28d.png
            adb shell input tap 888 1086
            sleep 2
            adb exec-out screencap -p > shots/3-today-7d.png
            adb shell input tap 540 230
            sleep 2
            adb exec-out screencap -p > shots/4-differences.png
            adb shell input tap 220 230
            sleep 2
            adb exec-out screencap -p > shots/5-history.png
            adb shell cmd locale set-app-locales com.aistudio.concretecalc.vwxyz --locales ar
            adb shell am force-stop com.aistudio.concretecalc.vwxyz
            adb shell am start -n com.aistudio.concretecalc.vwxyz/com.example.MainActivity
            sleep 6
            adb exec-out screencap -p > shots/6-arabic.png
            adb logcat -d -s AndroidRuntime:E > shots/crash.txt
            adb shell pidof com.aistudio.concretecalc.vwxyz > shots/pid.txt || echo none > shots/pid.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: shots }
